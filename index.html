<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music Player</title>
<meta name="description" content="Music player powered by a YouTube playlist">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, Arial, sans-serif;
    background: #0b0b0f;
    color: #fff;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    padding: 24px 16px 40px;
  }
  header {
    text-align: center;
    margin: 10px 0 22px;
  }
  header h1 { margin: 0; font-size: 28px; }
  header p { color: #9a9aa3; margin: 7px 0 0; font-size: 14px; }

  .player-card {
    background: #15151b;
    border: 1px solid #27272f;
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 18px 55px rgba(0,0,0,.35);
  }
  #player {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 15px;
    overflow: hidden;
    background: #000;
  }
  #player iframe {
    width: 100% !important;
    height: 100% !important;
  }

  .now {
    padding: 18px 4px 10px;
  }
  .label {
    color: #8e8e98;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #title {
    margin-top: 5px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
  }
  button {
    border: 0;
    color: white;
    background: #292930;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: transform .15s, background .15s;
  }
  button:hover { transform: scale(1.05); background: #373740; }
  button:active { transform: scale(.97); }
  .play {
    width: 66px;
    height: 66px;
    font-size: 27px;
    background: #fff;
    color: #111;
  }
  .play:hover { background: #eee; }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .action {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .random { background: #24242c; }
  .random.active { background: #fff; color: #111; }

  .status {
    text-align: center;
    min-height: 20px;
    color: #8e8e98;
    font-size: 12px;
    margin-top: 12px;
  }

  .notice {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #111116;
    border: 1px solid #24242b;
    color: #888892;
    font-size: 12px;
    line-height: 1.5;
  }

  @media (max-width: 520px) {
    .app { padding: 15px 10px 30px; }
    header h1 { font-size: 24px; }
    .player-card { border-radius: 18px; padding: 10px; }
    button { width: 48px; height: 48px; }
    .play { width: 62px; height: 62px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>🎵 My Music Player</h1>
    <p>Random music from my YouTube playlist</p>
  </header>

  <section class="player-card">
    <div id="player"></div>

    <div class="now">
      <div class="label">Now Playing</div>
      <div id="title">Loading playlist…</div>
    </div>

    <div class="controls">
      <button onclick="previousSong()" aria-label="Previous">⏮</button>
      <button class="play" id="playBtn" onclick="togglePlay()" aria-label="Play">▶</button>
      <button onclick="nextSong()" aria-label="Next">⏭</button>
    </div>

    <div class="actions">
      <button class="action random active" id="randomBtn" onclick="randomSong()">🔀 Random Song</button>
      <button class="action" onclick="openPlaylist()">📋 Playlist</button>
    </div>

    <div class="status" id="status">Preparing player…</div>

    <div class="notice">
      Music is played through the official YouTube embedded player. The site does not download or extract MP3 files.
    </div>
  </section>
</main>

<script>
const PLAYLIST_ID = "PLBO8vPt12vLdn6AmhpfMT1d28lbzE_HMB";

let player = null;
let randomMode = true;
let ready = false;

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: {
      listType: "playlist",
      list: PLAYLIST_ID,
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

function onPlayerReady() {
  ready = true;
  setStatus("Playlist loaded");

  // Give YouTube a moment to populate the playlist, then choose a random track.
  setTimeout(() => {
    if (!player) return;
    const list = player.getPlaylist() || [];

    if (list.length) {
      const index = Math.floor(Math.random() * list.length);
      player.setShuffle(true);
      player.playVideoAt(index);
      updateTitle();
    } else {
      setStatus("Click Play to start");
    }
  }, 1200);
}

function togglePlay() {
  if (!ready) return;
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
}

function nextSong() {
  if (!ready) return;
  player.nextVideo();
  setStatus("Loading next song…");
}

function previousSong() {
  if (!ready) return;
  player.previousVideo();
  setStatus("Loading previous song…");
}

function randomSong() {
  if (!ready) return;

  randomMode = true;
  player.setShuffle(true);

  const list = player.getPlaylist() || [];
  if (list.length > 1) {
    const current = player.getPlaylistIndex();
    let index = Math.floor(Math.random() * list.length);
    if (index === current) index = (index + 1) % list.length;
    player.playVideoAt(index);
  } else {
    player.playVideo();
  }

  document.getElementById("randomBtn").classList.add("active");
  setStatus("Random song selected");
}

function openPlaylist() {
  window.open(
    "https://www.youtube.com/playlist?list=" + PLAYLIST_ID,
    "_blank",
    "noopener,noreferrer"
  );
}

function onPlayerStateChange(event) {
  const playBtn = document.getElementById("playBtn");

  if (event.data === YT.PlayerState.PLAYING) {
    playBtn.textContent = "⏸";
    setStatus("Playing");
    updateTitle();
  } else if (event.data === YT.PlayerState.PAUSED) {
    playBtn.textContent = "▶";
    setStatus("Paused");
  } else if (event.data === YT.PlayerState.ENDED) {
    playBtn.textContent = "▶";
    if (randomMode) {
      setTimeout(randomSong, 300);
    }
  }
}

function updateTitle() {
  setTimeout(() => {
    if (!player || typeof player.getVideoData !== "function") return;
    const data = player.getVideoData();
    document.getElementById("title").textContent =
      data && data.title ? data.title : "YouTube playlist";
  }, 500);
}

function onPlayerError(event) {
  setStatus("This video cannot be played here. Skipping…");
  setTimeout(() => {
    if (randomMode) randomSong();
    else nextSong();
  }, 1200);
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}
</script>
</body>
</html>
