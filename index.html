<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhajan Sandhya — भजन संध्या</title>
<meta name="description" content="An evening of bhajans. Press play and let the diya burn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#150826;
    --sky-mid:#3a1a52;
    --sky-low:#7a3a3f;
    --gold:#e8a33d;
    --flame:#ff9346;
    --brass:#c9a227;
    --ivory:#f5ecd9;
    --ivory-dim:#cdbfa4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 120% 60% at 50% 100%, var(--sky-low) 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    background-attachment:fixed;
    font-family:'Poppins',sans-serif;
    color:var(--ivory);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6vh 5vw 8vh;
    overflow-x:hidden;
    position:relative;
  }

  /* faint stars */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 20%, var(--ivory-dim) 50%, transparent),
      radial-gradient(1px 1px at 65% 12%, var(--ivory-dim) 50%, transparent),
      radial-gradient(1.5px 1.5px at 80% 30%, var(--ivory-dim) 50%, transparent),
      radial-gradient(1px 1px at 40% 8%, var(--ivory-dim) 50%, transparent),
      radial-gradient(1.5px 1.5px at 92% 18%, var(--ivory-dim) 50%, transparent),
      radial-gradient(1px 1px at 10% 35%, var(--ivory-dim) 50%, transparent);
    opacity:0.5;
    pointer-events:none;
    z-index:0;
  }

  .diya-wrap{
    position:relative;
    z-index:1;
    width:120px;
    height:170px;
    margin-bottom:0.5rem;
    filter:drop-shadow(0 0 40px rgba(255,147,70,0.55));
  }

  .flame{
    position:absolute;
    left:50%;
    top:6px;
    width:20px;
    height:46px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 80%, #fff3c4 0%, var(--flame) 45%, rgba(255,80,30,0) 75%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    transform-origin:50% 100%;
    animation:flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) rotate(-1.5deg) scaleY(1); }
    20%{ transform:translateX(-48%) rotate(2deg) scaleY(1.05); }
    40%{ transform:translateX(-52%) rotate(-2.5deg) scaleY(0.95); }
    60%{ transform:translateX(-50%) rotate(1.5deg) scaleY(1.08); }
    80%{ transform:translateX(-49%) rotate(-1deg) scaleY(0.98); }
  }

  .diya-bowl{
    position:absolute;
    left:50%;
    top:56px;
    transform:translateX(-50%);
    width:110px;
    height:44px;
    background:linear-gradient(180deg, var(--brass) 0%, #8a6b18 100%);
    border-radius:0 0 110px 110px / 0 0 60px 60px;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.35), inset 0 4px 6px rgba(255,235,180,0.4);
  }
  .diya-rim{
    position:absolute;
    left:50%;
    top:50px;
    transform:translateX(-50%);
    width:118px;
    height:16px;
    background:linear-gradient(180deg, #f0cf6a 0%, var(--brass) 100%);
    border-radius:50%;
  }

  h1{
    font-family:'Yatra One',cursive;
    font-weight:400;
    font-size:clamp(2.2rem, 6vw, 3.4rem);
    margin:0.4rem 0 0.1rem;
    color:var(--gold);
    text-align:center;
    letter-spacing:0.5px;
    text-shadow:0 0 24px rgba(232,163,61,0.35);
    z-index:1;
  }
  h1 .en{
    display:block;
    font-family:'Poppins',sans-serif;
    font-weight:300;
    font-size:0.42em;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--ivory-dim);
    margin-top:0.4rem;
  }

  .tagline{
    z-index:1;
    max-width:36ch;
    text-align:center;
    color:var(--ivory-dim);
    font-weight:300;
    font-size:0.95rem;
    line-height:1.6;
    margin:0.8rem 0 3rem;
  }

  .player{
    z-index:1;
    width:100%;
    max-width:420px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(232,163,61,0.35);
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
    background:#0d0616;
  }
  .art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:#0d0616;
    overflow:hidden;
  }
  .art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05) brightness(0.92);
  }
  .art::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(13,6,22,0.85) 100%);
  }
  #yt-host{
    position:absolute;
    width:2px;
    height:2px;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }
  .meta{
    padding:1.1rem 1.3rem 0.4rem;
  }
  .track-title{
    font-size:0.95rem;
    font-weight:500;
    color:var(--ivory);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-sub{
    font-size:0.75rem;
    color:var(--ivory-dim);
    margin-top:0.15rem;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.6rem;
    padding:1rem 1rem 1.5rem;
  }
  .controls button{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ivory);
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, color 0.15s ease;
  }
  .controls button:hover{ color:var(--gold); transform:scale(1.08); }
  .controls button:active{ transform:scale(0.94); }
  .controls svg{ width:22px; height:22px; }
  .btn-play{
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(180deg, var(--gold) 0%, var(--brass) 100%);
    color:#1a0f0a;
    box-shadow:0 8px 20px rgba(232,163,61,0.35);
  }
  .btn-play:hover{ color:#1a0f0a; }
  .btn-play svg{ width:24px; height:24px; }

  footer{
    z-index:1;
    margin-top:3rem;
    color:var(--ivory-dim);
    font-size:0.78rem;
    letter-spacing:0.5px;
    opacity:0.7;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .flame{ animation:none; }
  }
</style>
</head>
<body>

  <div class="diya-wrap">
    <div class="flame"></div>
    <div class="diya-rim"></div>
    <div class="diya-bowl"></div>
  </div>

  <h1>भजन संध्या<span class="en">Bhajan Sandhya</span></h1>

  <p class="tagline">An evening of devotion. Light one diya, press play, and let the bhajans carry the rest.</p>

  <div class="player">
    <div class="art">
      <img id="thumb" src="" alt="">
      <div id="yt-host"></div>
    </div>
    <div class="meta">
      <div class="track-title" id="title">Loading playlist…</div>
      <div class="track-sub" id="sub">Bhajan Sandhya</div>
    </div>
    <div class="controls">
      <button id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" class="btn-play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>
  </div>

  <footer>Bhajan Sandhya</footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PLAYLIST_ID = 'PLW_QVE4bQ1Eo7RbN0nlIqFEFto1HatpSN';
    let player;
    let isPlaying = false;

    const thumbEl = document.getElementById('thumb');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');

    const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
    const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-host', {
        height: '2',
        width: '2',
        playerVars: {
          listType: 'playlist',
          list: PLAYLIST_ID,
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          iv_load_policy: 3
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      updateTrackInfo();
    }

    function updateTrackInfo() {
      try {
        const data = player.getVideoData();
        if (data && data.video_id) {
          thumbEl.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
          titleEl.textContent = data.title || 'Bhajan Sandhya';
          const idx = player.getPlaylistIndex ? player.getPlaylistIndex() : null;
          subEl.textContent = (idx !== null && idx >= 0) ? `Track ${idx + 1}` : 'Bhajan Sandhya';
        }
      } catch (e) { /* ignore */ }
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.outerHTML = playIcon.outerHTML.replace(/<path.*<\/path>|<path.*\/>/, ICON_PAUSE);
        updateTrackInfo();
      } else if (e.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        setPlayIcon(ICON_PLAY);
      } else if (e.data === YT.PlayerState.CUED) {
        updateTrackInfo();
      } else if (e.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        setPlayIcon(ICON_PLAY);
      }
    }

    function setPlayIcon(svgInner) {
      const svg = document.getElementById('playIcon');
      svg.innerHTML = svgInner;
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
        setPlayIcon(ICON_PLAY);
        isPlaying = false;
      } else {
        player.playVideo();
        setPlayIcon(ICON_PAUSE);
        isPlaying = true;
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (player) player.nextVideo();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (player) player.previousVideo();
    });
  </script>

</body>
</html>
